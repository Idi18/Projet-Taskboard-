# StatefulSet PostgreSQL - TaskBoard
# Exigences DB-1, DB-2, DB-4, DB-5 et K8S-5

apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: db
  namespace: taskboard
  labels:
    app: taskboard
    tier: db

spec:
  serviceName: db
  replicas: 1

  selector:
    matchLabels:
      app: taskboard
      tier: db

  template:
    metadata:
      labels:
        app: taskboard
        tier: db

    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent

          ports:
            - name: postgres
              containerPort: 5432

          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: web-config
                  key: DB_NAME

            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: web-config
                  key: DB_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD

            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data

            - name: db-init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: db-init-scripts
          configMap:
            name: db-init

  volumeClaimTemplates:
    - metadata:
        name: db-data
        labels:
          app: taskboard
          tier: db

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 1Gi
