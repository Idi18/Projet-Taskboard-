# Service NodePort : expose l'application web hors du cluster (K8S-6)
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: taskboard
  labels:
    app: taskboard
    tier: web
spec:
  type: NodePort
  selector:
    app: taskboard
    tier: web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080