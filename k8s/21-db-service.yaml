# Service interne PostgreSQL
# Exigences DB-6 et K8S-1

apiVersion: v1
kind: Service

metadata:
  name: db
  namespace: taskboard
  labels:
    app: taskboard
    tier: db

spec:
  type: ClusterIP

  selector:
    app: taskboard
    tier: db

  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: postgres
